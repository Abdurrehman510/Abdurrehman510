# Place this file at: .github/workflows/metrics.yml
# in your profile repository (github.com/Abdurrehman510/Abdurrehman510).
#
# Requires a repository secret named METRICS_TOKEN:
#   a classic Personal Access Token with scopes: repo, read:user

name: GitHub Metrics

on:
  schedule:
    - cron: "30 0 * * *" # Daily at 06:00 IST
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "metrics/**"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview, contribution calendar and code volume
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update overview [skip ci]"
          user: Abdurrehman510
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update languages [skip ci]"
          user: Abdurrehman510
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_recent_days: 30

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): update achievements [skip ci]"
          user: Abdurrehman510
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
